<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rei Agro - Cadastro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
  <script src="{% static 'core/js/script.js' %}"></script>
</head>

<body>

  <div class="mobile-app">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
          aria-controls="menuLateral">
          <i class="bi bi-list"></i>
        </button>

        <div>
          <p class="topbar-subtitle">Sistema de Gestão</p>
          <h1 class="topbar-title">Rei Agro</h1>
        </div>
      </div>

      <div class="profile-mini">
        <i class="bi bi-person-circle"></i>
      </div>
    </header>

    <div class="offcanvas offcanvas-start sidebar-custom" tabindex="-1" id="menuLateral"
      aria-labelledby="menuLateralLabel">
      <div class="offcanvas-header border-0 pb-0">
        <div>
          <p class="menu-subtitle mb-1">Navegação</p>
          <h5 class="offcanvas-title fw-bold mb-0" id="menuLateralLabel">Rei Agro</h5>
        </div>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
      </div>

      <div class="offcanvas-body pt-3">
        <div class="menu-user-card">
          <div class="menu-user-icon">
            <i class="bi bi-shop"></i>
          </div>
          <div>
            <strong>Caixa Principal</strong>
            <p class="mb-0">Gestão rápida e objetiva</p>
          </div>
        </div>

        <div class="menu-nav nav flex-column nav-pills mt-4">
          <a href="index.html" class="nav-link">
            <i class="bi bi-cart3"></i>
            <span>Frente de Caixa</span>
          </a>

          <a href="cadastro.html" class="nav-link active">
            <i class="bi bi-person-plus"></i>
            <span>Cadastro</span>
          </a>

          <a href="consulta.html" class="nav-link">
            <i class="bi bi-box-seam"></i>
            <span>Consulta de Estoque</span>
          </a>

          <a href="fechamento.html" class="nav-link">
            <i class="bi bi-cash-coin"></i>
            <span>Fechamento de Caixa</span>
          </a>
        </div>
      </div>
    </div>

    <main class="main-content">
      <section id="aba-cadastro">

        <div class="app-card mb-4">
          <div class="section-head">
            <h3>Cadastrar Cliente</h3>
            <span class="section-tag">Fidelização</span>
          </div>

          <form action="/cadastrar-cliente" method="POST">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome Completo</label>
              <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" name="cpf">
              </div>
              <div class="col-6">
                <label for="telefone_cliente" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone_cliente" name="telefone">
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email">
            </div>

            <button type="submit" class="btn btn-rei w-100">
              <i class="bi bi-person-check me-2"></i>Salvar Cliente
            </button>
          </form>
        </div>

        <div class="app-card mb-4">
          <div class="section-head">
            <h3>Cadastrar Produto</h3>
            <span class="section-tag">Estoque</span>
          </div>

          <form action="/cadastrar-produto" method="POST">
            <div class="mb-3">
              <label for="nome_produto" class="form-label">Nome do Produto</label>
              <input type="text" class="form-control" id="nome_produto" name="nome_produto" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="id_categoria" class="form-label">Categoria</label>
                <select class="form-select" id="id_categoria" name="id_categoria" required>
                  <option value="" selected disabled>Selecione...</option>
                  <option value="1">Nutrição Animal</option>
                  <option value="2">Jardinagem e Agro</option>
                  <option value="3">Saúde Animal</option>
                  <option value="4">Higiene</option>
                  <option value="5">Acessórios</option>
                  <option value="6">Outros</option>
                </select>
              </div>
              <div class="col-6">
                <label for="id_fornecedor_prod" class="form-label">Fornecedor</label>
                <select class="form-select" id="id_fornecedor_prod" name="id_fornecedor" required>
                  <option value="" selected disabled>Selecione...</option>
                  <option value="1">My Pet Brasil</option>
                  <option value="2">Rações Renata</option>
                  <option value="3">Distribuidora Mundo Animal</option>
                  <option value="4">Vetline</option>
                  <option value="5">Universo Pet</option>
                  <option value="6">Premier Pet</option>
                  <option value="7">Special Dog</option>
                  <option value="8">Grandfood (Magnus)</option>
                  <option value="9">Total Alimentos</option>
                  <option value="10">Savana Pet</option>
                </select>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label for="preco_custo" class="form-label">Preço Custo</label>
                  <input type="text" class="form-control" id="preco_custo" name="preco_custo" placeholder="0.00">
                </div>
                <div class="col-6">
                  <label for="preco_venda" class="form-label">Preço Venda</label>
                  <input type="text" class="form-control" id="preco_venda" name="preco_venda" placeholder="0.00">
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label for="quantidade_estoque" class="form-label">Qtd. Estoque</label>
                  <input type="number" class="form-control" id="quantidade_estoque" name="quantidade_estoque">
                </div>
                <div class="col-6">
                  <label for="unidade_medida" class="form-label">Unidade</label>
                  <input type="text" class="form-control" id="unidade_medida" name="unidade_medida"
                    placeholder="Ex: KG, UN">
                </div>
              </div>

              <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-box-seam me-2"></i>Salvar Produto
              </button>
          </form>
        </div>

        <div class="app-card mb-4">
          <div class="section-head">
            <h3>Cadastrar Fornecedor</h3>
            <span class="section-tag">Suprimentos</span>
          </div>

          <form action="/cadastrar-fornecedor" method="POST">
            <div class="mb-3">
              <label for="nome_fantasia" class="form-label">Nome Fantasia</label>
              <input type="text" class="form-control" id="nome_fantasia" name="nome_fantasia" required>
            </div>

            <div class="mb-3">
              <label for="cnpj" class="form-label">CNPJ</label>
              <input type="text" class="form-control" id="cnpj" name="cnpj">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="telefone_forn" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone_forn" name="telefone">
              </div>
              <div class="col-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email">
              </div>
            </div>

            <button type="submit" class="btn btn-rei w-100">
              <i class="bi bi-truck me-2"></i>Salvar Fornecedor
            </button>
          </form>
        </div>

      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
