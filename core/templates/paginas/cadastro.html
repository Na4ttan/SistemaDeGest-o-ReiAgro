{% extends 'base.html' %}

{% block title %}Cadastro - Rei Agro{% endblock %}

{% block content %}
<section id="aba-cadastro">

    <div class="app-card mb-4">
        <div class="section-head">
            <h3>Cadastrar Cliente</h3>
            <span class="section-tag">Fidelização</span>
        </div>

        <form action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" name="cpf">
                </div>
                <div class="col-6">
                    <label for="telefone_cliente" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone_cliente" name="telefone">
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>

            <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-person-check me-2"></i>Salvar Cliente
            </button>
        </form>
    </div>

    <div class="app-card mb-4">
        <div class="section-head">
            <h3>Cadastrar Produto</h3>
            <span class="section-tag">Estoque</span>
        </div>

        <form action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome_produto" class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="nome_produto" name="nome_produto" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="id_categoria" class="form-label">Categoria</label>
                    <select class="form-select" id="id_categoria" name="id_categoria" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="1">Nutrição Animal</option>
                        <option value="2">Jardinagem e Agro</option>
                        <option value="6">Outros</option>
                    </select>
                </div>
                <div class="col-6">
                    <label for="id_fornecedor_prod" class="form-label">Fornecedor</label>
                    <select class="form-select" id="id_fornecedor_prod" name="id_fornecedor" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="1">My Pet Brasil</option>
                        <option value="7">Special Dog</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="preco_custo" class="form-label">Preço Custo</label>
                    <input type="text" class="form-control" id="preco_custo" name="preco_custo" placeholder="0.00">
                </div>
                <div class="col-6">
                    <label for="preco_venda" class="form-label">Preço Venda</label>
                    <input type="text" class="form-control" id="preco_venda" name="preco_venda" placeholder="0.00">
                </div>
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <label for="quantia" class="form-label"> Quantidade </label>
                    <input type="number" class="form-control" id="quantia" name="quantia" placeholder="1">
                </div>
                <div class="col-6">
                    <label for="unidade_medida" class="form-label"> Forma de madida </label>
                    <select id="unidade_medida" class="form-select">
                        <option value="KG" selected>Quilograma</option>
                        <option value="unidade">Unidade</option>
                        <option value="litro">Litro</option>
                        <option value="metro">metro</option>
                        <option value="pacote">Pacote</option>
                    </select>
            </div>

            <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-box-seam me-2"></i>Salvar Produto
            </button>
        </form>
    </div>

    <div class="app-card mb-4">
        <div class="section-head">
            <h3>Cadastrar Fornecedor</h3>
            <span class="section-tag">Suprimentos</span>
        </div>

        <form action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome_fantasia" class="form-label">Nome Fantasia</label>
                <input type="text" class="form-control" id="nome_fantasia" name="nome_fantasia" required>
            </div>

            <div class="mb-3">
                <label for="cnpj" class="form-label">CNPJ</label>
                <input type="text" class="form-control" id="cnpj" name="cnpj">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="telefone_forn" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone_forn" name="telefone">
                </div>
                <div class="col-6">
                    <label for="email_forn" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email_forn" name="email_forn">
                </div>
            </div>

            <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-truck me-2"></i>Salvar Fornecedor
            </button>
        </form>
    </div>

</section>
{% endblock %}
