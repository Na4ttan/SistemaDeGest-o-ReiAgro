{% extends 'base.html' %}

{% block title %}Cadastro - Rei Agro{% endblock %}

{% block content %}
<section id="aba-cadastro">

    <div class="app-card mb-4">
        <div class="section-head">
            <h3>Cadastrar Cliente</h3>
        </div>

        <form action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="number" class="form-control" id="cpf" name="cpf" min="1000000000" max="99999999999" required>
                </div>
                <div class="col-6">
                    <label for="telefone_cliente" class="form-label">Telefone</label>
                    <input type="number" 
                       class="form-control" 
                       id="telefone_cliente" 
                       name="telefone_cliente" 
                       min="11000000000" 
                       max="99999999999" 
                       placeholder="ex: 19900001234">
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email_cliente">
            </div>

            <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-person-check me-2"></i>Salvar Cliente
            </button>
        </form>
    </div>

    <div class="app-card mb-4">
        <div class="section-head">
            <h3>Cadastrar Produto</h3>
        </div>

        <form action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome_produto" class="form-label">Nome do Produto</label>
                <input type="text" class="form-control" id="nome_produto" name="nome_produto" required>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="id_categoria" class="form-label">Categoria</label>
                    <select class="form-select" id="id_categoria" name="id_categoria" required>
                        <option value="" selected disabled>Selecione...</option>
                        
                        {% for categoria in categorias %}
                            <option value="{{categoria.id }}">{{ categoria.nome_categoria }}</option>
                        {% empty %}
                            <option disabled>Nenhuma categoria cadastrada</option>
                        {% endfor %}

                    </select>

                </div>

                <div class="col-6">
                    <label for="id_fornecedor_prod" class="form-label">Fornecedor</label>
                    <select class="form-select" id="id_fornecedor_prod" name="id_fornecedor" required>
                        <option value="" selected disabled>Selecione...</option>
                        {% for fornecedor in fornecedores %}
                            <option value="{{ fornecedor.id }}">{{ fornecedor.nome_fantasia }}</option>
                        {% empty %}
                            <option disabled>Nenhum fornecedor cadastrado</option>
                        {% endfor %} </select>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="preco_custo" class="form-label">Preço Custo</label>
                    <input type="number" class="form-control" id="preco_custo" name="preco_custo" step="0.01" min="0" placeholder="0.00" required>
                </div>
                <div class="col-6">
                    <label for="preco_venda" class="form-label">Preço Venda</label>
                    <input type="number" class="form-control" id="preco_venda" name="preco_venda" step="0.01" min="0" placeholder="0.00" required>
                </div>
            <div class="row g-2 mb-4">
                <div class="col-6">
                    <label for="quantia" class="form-label"> Quantidade </label>
                    <input type="number" name="quantia" class="form-control" value="0" min="0" required>
                </div>
                <div class="col-6">
                    <label for="unidade_medida" class="form-label"> Forma de medida </label>
                    <select id="unidade_medida" class="form-select" name="unidade_medida">
                        <option value="KG" selected>Quilograma</option>
                        <option value="UN">Unidade</option>
                        <option value="LT">Litro</option>
                        <option value="MT">Metro</option>
                        <option value="PA">Pacote</option>
                    </select>
                </div>
            <!-- Linha do Código de Barras com Botão de Câmera -->
            <div class="row g-2 mb-3">
                <div class="col-12">
                    <label for="barcode" class="form-label">Código de barras</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-qr-code-scan"></i></span>
                        <input type="number" id="barcode" name="barcode" class="form-control" required>
                        
                        <!-- Botão da Câmera -->
                        <button class="btn btn-outline-rei" type="button" onclick="alternarCamera()">
                            <i id="icone-camera" class="bi bi-camera"></i>
                        </button>
                    </div>
                    <!-- Container do vídeo (Scanner) -->
                    <div id="reader" style="display: none; width: 100%; border-radius: 16px; overflow: hidden; margin-top: 10px;"></div>
                </div>
            </div>

<div class="row g-2 mb-4">
    <div class="col-12">
        <label for="data_validade" class="form-label">Data de Validade</label>
        <input type="date" class="form-control" id="data_validade" name="data_validade">
    </div>
</div>
            <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-box-seam me-2"></i>Salvar Produto
            </button>
        </form>
    </div>
</div>
</div>

    <!--formulário de ração vendida a granel-->
    <div class="app-card mb-4">
    <div class="section-head">
        <h3>Cadastrar Ração (Venda a Granel)</h3>
    </div>

    <form action="{% url 'cadastro' %}" method="POST">
        {% csrf_token %}
        <!-- Identificador para a lógica no views.py -->
        <input type="hidden" name="venda_granel_especifica" value="true">
        <!-- Forçamos a unidade Pacote, pois o desmembramento parte do saco fechado -->
        <input type="hidden" name="unidade_medida" value="PA">
        <input type="hidden" name="id_categoria" value="1">

        <div class="mb-3">
            <label class="form-label">Nome da Ração</label>
            <input type="text" class="form-control" name="nome_produto" placeholder="Ex: Ração Bonzo Carne 15kg" required>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="form-label">Fornecedor</label>
                <select class="form-select" name="id_fornecedor" required>
                    <option value="" selected disabled>Selecione...</option>
                    {% for fornecedor in fornecedores %}
                        <option value="{{ fornecedor.id }}">{{ fornecedor.nome_fantasia }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>


        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="form-label">Preço Custo (Saco)</label>
                <input type="number" step="0.01" class="form-control" name="preco_custo" placeholder="0.00" min="0.01" required>
            </div>
            <div class="col-6">
                <label class="form-label">Preço Venda (Saco)</label>
                <input type="number" step="0.01" class="form-control" name="preco_venda_saco" placeholder="0.00" min="0.01" required>
            </div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="form-label">Peso do Saco (KG)</label>
                <input type="number" step="0.001" class="form-control" name="peso_pacote" placeholder="Ex: 15" min="1" required>
            </div>
            <div class="col-6">
                <label class="form-label">Qtd. (Sacos)</label>
                <input type="number" class="form-control" name="quantia" value="0" min="0" required>
            </div>
        </div>

        <div class="row g-2 mb-3">
                <div class="col-12">
                    <label for="barcode" class="form-label">Código de barras</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-qr-code-scan"></i></span>
                        <input type="number" id="barcode" name="barcode" class="form-control" required>
                        
                        <!-- Botão da Câmera -->
                        <button class="btn btn-outline-rei" type="button" onclick="alternarCamera()">
                            <i id="icone-camera" class="bi bi-camera"></i>
                        </button>
                    </div>
                    <!-- Container do vídeo (Scanner) -->
                    <div id="reader" style="display: none; width: 100%; border-radius: 16px; overflow: hidden; margin-top: 10px;"></div>
                </div>
            </div>

        <div class="row g-2 mb-4">
            <div class="col-12">
                <label class="form-label">Data de Validade</label>
                <input type="date" class="form-control" name="data_validade">
            </div>
        </div>

        <button type="submit" class="btn btn-rei w-100">
            <i class="bi bi-box-seam me-2"></i>Salvar Ração no Estoque
        </button>
    </form>
</div>

    <div class="app-card mb-4">
        <div class="section-head">
            <h3>Cadastrar Fornecedor</h3>
        </div>

        <form action="{% url 'cadastro' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="nome_fantasia" class="form-label">Nome Fantasia</label>
                <input type="text" class="form-control" id="nome_fantasia" name="nome_fantasia" required>
            </div>

            <div class="mb-3">
                <label for="cnpj" class="form-label">CNPJ</label>
                <input type="text" class="form-control" id="cnpj" name="cnpj">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label for="telefone_forn" class="form-label">Telefone</label>
                    <input type="number" class="form-control" id="telefone_forn" name="telefone_forn">
                </div>
                <div class="col-6">
                    <label for="email_forn" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email_forn" name="email_forn">
                </div>
            </div>

            <button type="submit" class="btn btn-rei w-100">
                <i class="bi bi-truck me-2"></i>Salvar Fornecedor
            </button>
        </form>
    </div>

</section>
{% endblock %}
