{% extends 'base.html' %}

{% block title %}Frente de Caixa - Rei Agro{% endblock %}

{% block content %}
{% csrf_token %}
<section id="aba-caixa">
  <div class="app-card">
    <div class="section-head">
      <h3>Nova venda</h3>
      <span class="section-tag">Venda rápida</span>
    </div>

<div class="mb-3">
  <label class="form-label">Identifique o cliente com o CPF</label>
  <input type="number" 
         id="input-cpf" 
         class="form-control" 
         value="{{ request.GET.cpf_novo }}" 
         min="100000" 
         step="1">
  <input type="hidden" id="id-cliente-venda" value="">
  <div id="nome-cliente-cpf" class="form-text text-success fw-bold mt-1" style="display: none;"></div>
</div>

    <div class="mb-3">
  <label class="form-label">Leitor de Código de Barras</label>
  <div class="input-group">
    <span class="input-group-text"><i class="bi bi-qr-code-scan"></i></span>
    <input type="text" id="input-scan" class="form-control" placeholder="Aponte o leitor ou digite...">
    
    <button class="btn btn-outline-rei" type="button" onclick="alternarCamera()">
      <i id="icone-camera" class="bi bi-camera"></i>
    </button>
  </div>
</div>

<div id="reader" style="display: none; width: 100%; border-radius: 16px; overflow: hidden; margin-top: 10px;"></div>

    <div class="mb-3">
      <label class="form-label">Produto (Seleção Manual)</label>
        <select class="form-select" id="select-produto">
          <option value="" selected disabled>Selecione o produto...</option>
            {% for produto in produtos %}
              <option value="{{ produto.id }}" 
                    data-nome="{{ produto.nome_produto }}" 
                    data-preco="{{ produto.preco_venda }}"
                    data-unidade="{{ produto.unidade_medida }}"
                    data-codigo="{{ produto.codigo_barras }}"> 
                {{ produto.nome_produto }}  
                {% if produto.data_validade %}(Venc: {{ produto.data_validade|date:"d/m/Y" }}){% endif %}
              </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Preço Unitário</label>
      <div class="input-group">
        <span class="input-group-text">R$</span>
        <input type="text" id="input-preco" class="form-control" placeholder="0,00" readonly
          style="background-color: #f8f9fa;">
      </div>
    </div>

    <div class="row g-2">
      <div class="col-12">
        <label class="form-label">Quantidade</label>
        <input type="number" id="input-quantidade" class="form-control" value="1" min="0.001" step="1">
        <small id="alerta-quantidade" class="text-danger" style="display: none;">Este produto não aceita venda fracionada.</small>
      </div>
    </div>

    <button type="button" onclick="adicionarItem()" class="btn btn-rei w-100 mt-3">
      <i class="bi bi-plus-circle me-2"></i>Adicionar item
    </button>

  </div>

  <div class="app-card">
    <div class="section-head">
      <h3>Resumo da compra</h3>
      <span id="contador-itens" class="section-tag">0 itens</span>
    </div>

    <div id="lista-itens-venda">
    </div>

    <div class="total-sale">
      <span>Total da venda</span>
      <strong id="valor-total-exibicao">R$ 0,00</strong>
    </div>

    <div class="mt-4 mb-3">
      <label class="form-label fw-bold">Forma de Pagamento</label>
      <select id="select-pagamento" class="form-select">
        <option value="Dinheiro" selected>Dinheiro</option>
        <option value="PIX">PIX</option>
        <option value="Crédito">Cartão de Crédito</option>
        <option value="Débito">Cartão de Débito</option>
      </select>
    </div>

  <div id="secao-troco" class="mt-3 p-3 border rounded bg-light">
    <div class="mb-2">
      <label class="form-label small fw-bold">Valor Recebido (R$)</label>
      <input type="number" id="input-valor-recebido" class="form-control" placeholder="0,00" step="0.01">
    </div>
  <div class="d-flex justify-content-between align-items-center">
    <span class="fw-bold text-muted">Troco:</span>
    <strong id="valor-troco" class="text-success" style="font-size: 1.2rem;">R$ 0,00</strong>
  </div>
</div>

    <button type="button" onclick="finalizarVenda()" class="btn btn-dark w-100 mt-3">
      <i class="bi bi-check2-circle me-2"></i>Finalizar venda
    </button>
  </div>
</section>

{% endblock %}
