{% extends "base.html" %}

{% block title %}Login - Rei Agro{% endblock %}

{% block content %}
<section id="aba-login">

    <div class="app-card mb-4" style="max-width: 500px; margin: auto;"> 
        <div class="section-head">
            <h3>Acesso ao Sistema Rei Agro</h3>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            {% if form.errors %}
                <div class="alert alert-danger">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Usuário</label>
                <input type="text" 
                       name="{{ form.username.html_name }}" 
                       class="form-control" 
                       id="{{ form.username.id_for_label }}" 
                       required>
            </div>

            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Senha</label>
                <input type="password" 
                       name="{{ form.password.html_name }}" 
                       class="form-control" 
                       id="{{ form.password.id_for_label }}" 
                       required>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success">Entrar</button>
            </div>
        </form>
    </div>

</section>
{% endblock %}
